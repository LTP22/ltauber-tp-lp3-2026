spring.application.name=LT-taller-git-2026

# H2 en memoria: la base se recrea en cada arranque, ideal para desarrollo y para que
# la demo de la catedra siempre arranque "limpia" sin archivos que limpiar a mano.
# DB_CLOSE_DELAY=-1 evita que H2 cierre la base cuando la primera conexion se libera
# (Spring abre y cierra conexiones del pool todo el tiempo).
spring.datasource.url=jdbc:h2:mem:cs2db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create-drop: Hibernate crea el esquema al arrancar y lo descarta al apagar el servicio.
# Tiene sentido porque la base es efimera (en memoria); no hay datos que preservar entre corridas.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Consola web de H2, para poder abrir la base y mirar las tablas mientras el servicio corre.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
